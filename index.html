<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEERY | Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a0000);
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .circle-img {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: url('image2.jpg') no-repeat center center/cover;
      box-shadow: 0 0 60px rgba(255, 0, 0, 0.9);
      animation: fadeInUp 1s ease-out forwards;
    }

    .info-btn {
      margin-top: 50px;
      padding: 18px 50px;
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, #ff0000, #cc0000);
      border: none;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: fadeInUp 1s ease-out forwards;
      animation-delay: 0.5s;
      animation-fill-mode: forwards;
      opacity: 0;
    }

    .info-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(255, 0, 0, 1), inset 0 -4px 0 rgba(0, 0, 0, 0.5);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 1rem;
      color: #ccc;
      animation: fadeInUp 1s ease-out forwards;
      animation-delay: 1s;
      animation-fill-mode: forwards;
      opacity: 0;
    }

    footer a {
      color: #ff4d4d;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    footer a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    }

    @media (max-width: 600px) {
      .circle-img {
        width: 200px;
        height: 200px;
      }

      .info-btn {
        font-size: 1.2rem;
        padding: 15px 35px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="circle-img"></div>
    <a href="jeeryweb1.html" class="info-btn">Enter JEERY</a>
  </div>
  <footer>
    <a href="https://www.instagram.com/editsby.himanshu?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank">
      Made by Himanshu
    </a>
  </footer>
</body>
</html>
